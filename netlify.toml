[build]
  command        = "npm run build"
  publish        = "dist"
  functions      = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION            = "20"
  # Non-credential public config & bucket names that legitimately appear in repo
  # docs, HTML/SEO, or Vite's client bundle (dist/). All real credentials
  # (R2_SECRET_ACCESS_KEY, R2_ACCESS_KEY_ID, R2_ACCOUNT_ID, BREVO_API_KEY,
  # FIREBASE_PRIVATE_KEY, etc.) remain strictly scanned and protected.
  SECRETS_SCAN_OMIT_KEYS  = "ALLOWED_ORIGIN,R2_PUBLIC_BUCKET,R2_Public_Bucket,R2_PUBLIC_BUCKET_NAME,R2_PUBLIC_BUCKET_URL,R2_PRIVATE_BUCKET,R2_Private_Bucket,R2_PRIVATE_BUCKET_NAME,R2_BUCKET_NAME,BREVO_SENDER_NAME,BREVO_SENDER_EMAIL,FIREBASE_PROJECT_ID,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_GA_MEASUREMENT_ID,VITE_GIPHY_API_KEY"

# ── SPA fallback — /landing canonical-redirects to / ──────────────────────────
[[redirects]]
  from   = "/landing"
  to     = "/"
  status = 301
  force  = true

# SPA fallback for all other routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Netlify Functions ──────────────────────────────────────────────────────────
[functions]
  node_bundler          = "esbuild"
  external_node_modules = ["firebase-admin"]
  included_files        = ["Templates/**"]

# ══════════════════════════════════════════════════════════════════════════════
# HEADERS — Security + Performance + SEO
# ══════════════════════════════════════════════════════════════════════════════

# Security + performance + internationalisation headers for ALL pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "SAMEORIGIN"
    X-XSS-Protection           = "1; mode=block"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(self), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # FIX H-07: Content-Security-Policy — defence-in-depth against XSS.
    # 'unsafe-inline' is needed for Vite's injected runtime styles and inline event handlers.
    # Tighten by replacing 'unsafe-inline' with hashes/nonces once the build pipeline supports it.
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.hcaptcha.com https://hcaptcha.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://api.abstractapi.com https://api.giphy.com https://www.youtube.com https://uguu.se https://*.uguu.se https://*.r2.dev https://*.netlify.app wss:; frame-src https://hcaptcha.com https://js.hcaptcha.com https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com; object-src 'none'; base-uri 'self';"
    # Tell CDNs/proxies to serve different cached versions per language preference
    Vary                       = "Accept-Language"
    # Primary content language — India English; app also serves English globally
    Content-Language           = "en-IN, en, hi"
    # Enable browser DNS prefetching (speeds up third-party resource loading)
    X-DNS-Prefetch-Control     = "on"
    # HTTP Early Hints / preconnect — browser starts TCP+TLS before HTML is parsed
    # Covers Google Fonts, Firebase Auth, Firestore, Firebase Storage
    Link                       = "<https://fonts.googleapis.com>; rel=preconnect, <https://fonts.gstatic.com>; rel=preconnect; crossorigin, <https://firestore.googleapis.com>; rel=preconnect; crossorigin, <https://identitytoolkit.googleapis.com>; rel=preconnect; crossorigin, <https://securetoken.googleapis.com>; rel=preconnect; crossorigin, <https://firebasestorage.googleapis.com>; rel=preconnect; crossorigin, <https://www.googleapis.com>; rel=preconnect; crossorigin"

# Cache: Vite hashed assets (JS/CSS bundles) — immutable 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache: images in public/ — 30 days
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# Cache: fonts — 1 year
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No-cache: HTML (always fresh so updates are picked up instantly)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"
    Expires       = "0"

# No-cache: Service Worker (must always be fresh)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

# Manifest — short cache with revalidation
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
    Content-Type  = "application/manifest+json; charset=utf-8"

# Sitemap — daily cache
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
    Content-Type  = "application/xml; charset=utf-8"

# Robots.txt — 24h cache
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "text/plain; charset=utf-8"
